<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VirtShield — DDoS Prevention Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
/* ==========================================================
   VirtShield — DDoS Prevention Console
   Design system: Instrument Serif (display) + DM Sans (body)
   Palette: Crony Hardware Console — warm cream / charcoal
   Author: Oladeji Ibrahim Olaleye | U22CYS1103
   ========================================================== */

:root {
  --bg:           #f5f3ee;
  --surface:      #faf9f6;
  --surface-alt:  #f0ede6;
  --border:       #ddd9d0;
  --border-soft:  #e8e4da;
  --text:         #1a1814;
  --text-mid:     #4a4540;
  --text-muted:   #7a7670;
  --text-faint:   #aaa49e;
  --accent:       #1a1814;
  --accent-warm:  #8b6f47;
  --danger:       #c0392b;
  --danger-soft:  #fdf0ee;
  --danger-border:#f5c6c0;
  --warn:         #b8860b;
  --warn-soft:    #fdf8ec;
  --warn-border:  #f0d98a;
  --success:      #2d6a4f;
  --success-soft: #edf7f1;
  --success-border:#a8d5bb;
  --shadow-sm:    0 1px 3px rgba(26,24,20,.08);
  --shadow-md:    0 4px 12px rgba(26,24,20,.10);
  --shadow-lg:    0 8px 32px rgba(26,24,20,.12);
  --radius:       10px;
  --radius-sm:    6px;
  --sidebar-w:    240px;
  --t-xs:   0.70rem;
  --t-sm:   0.80rem;
  --t-base: 0.88rem;
  --t-md:   0.94rem;
  --t-lg:   1.05rem;
  --t-xl:   1.25rem;
  --t-2xl:  1.6rem;
  --t-3xl:  2.1rem;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-7: 32px; --sp-8: 40px;
}
[data-theme="dark"] {
  --bg:           #111009;
  --surface:      #1a1814;
  --surface-alt:  #231f1a;
  --border:       #2e2a24;
  --border-soft:  #28241f;
  --text:         #f0ede6;
  --text-mid:     #c8c0b4;
  --text-muted:   #8a8278;
  --text-faint:   #5a5550;
  --accent:       #f0ede6;
  --accent-warm:  #c8a96a;
  --danger:       #e05c4b;
  --danger-soft:  #2a1510;
  --danger-border:#5a2018;
  --warn:         #d4a017;
  --warn-soft:    #251e08;
  --warn-border:  #5a4710;
  --success:      #4a9e6f;
  --success-soft: #0e2018;
  --success-border:#1e5035;
  --shadow-sm:    0 1px 3px rgba(0,0,0,.3);
  --shadow-md:    0 4px 12px rgba(0,0,0,.35);
  --shadow-lg:    0 8px 32px rgba(0,0,0,.4);
}

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: var(--t-base);
  background: var(--bg);
  color: var(--text);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; }

.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  grid-template-rows: 100vh;
  overflow: hidden;
}

.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  z-index: 50;
}
.sidebar-header {
  padding: var(--sp-5) var(--sp-5) var(--sp-4);
  border-bottom: 1px solid var(--border-soft);
}
.brand {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  text-decoration: none;
}
.brand-icon {
  width: 34px; height: 34px;
  background: var(--text);
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.brand-icon svg { color: var(--bg); }
.brand-name {
  font-family: 'Instrument Serif', Georgia, serif;
  font-size: var(--t-lg);
  color: var(--text);
  line-height: 1.15;
  letter-spacing: -.01em;
  display: block;
}
.brand-sub {
  font-size: var(--t-xs);
  color: var(--text-muted);
  display: block;
  margin-top: 1px;
}
.sys-status {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  margin-top: var(--sp-3);
  padding: var(--sp-2) var(--sp-3);
  border-radius: 20px;
  background: var(--surface-alt);
  border: 1px solid var(--border);
  font-size: var(--t-xs);
  color: var(--text-mid);
}
.status-pip {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--success);
  flex-shrink: 0;
  box-shadow: 0 0 0 2px var(--success-soft);
}
.status-pip.attacking  { background: var(--danger); box-shadow: 0 0 0 2px var(--danger-soft); animation: blink 1s infinite; }
.status-pip.mitigating { background: var(--warn);   box-shadow: 0 0 0 2px var(--warn-soft);   animation: blink 1.2s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }

.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: var(--sp-4) var(--sp-3);
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
}
.nav-section-label {
  font-size: var(--t-xs);
  font-weight: 600;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: .08em;
  padding: var(--sp-3) var(--sp-2) var(--sp-1);
}
.nav-item {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-2) var(--sp-3);
  border-radius: var(--radius-sm);
  cursor: pointer;
  color: var(--text-mid);
  font-size: var(--t-sm);
  font-weight: 500;
  transition: background .15s, color .15s;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
  position: relative;
}
.nav-item:hover { background: var(--surface-alt); color: var(--text); }
.nav-item.active { background: var(--text); color: var(--bg); }
.nav-item.active svg { color: var(--bg); }
.nav-icon { width: 16px; height: 16px; flex-shrink: 0; }
.nav-item .nav-badge {
  margin-left: auto;
  background: var(--danger);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 10px;
  min-width: 18px;
  text-align: center;
  display: none;
}
.nav-item.active .nav-badge { background: var(--bg); color: var(--text); }

.sidebar-footer {
  padding: var(--sp-4) var(--sp-4) var(--sp-5);
  border-top: 1px solid var(--border-soft);
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}
.theme-toggle {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  font-size: var(--t-xs);
  color: var(--text-muted);
}
.toggle-btn {
  position: relative;
  width: 34px; height: 19px;
  background: var(--border);
  border-radius: 10px;
  border: none;
  cursor: pointer;
  transition: background .2s;
  flex-shrink: 0;
}
.toggle-btn::after {
  content: '';
  position: absolute;
  top: 3px; left: 3px;
  width: 13px; height: 13px;
  background: var(--surface);
  border-radius: 50%;
  transition: transform .2s;
  box-shadow: 0 1px 3px rgba(0,0,0,.2);
}
[data-theme="dark"] .toggle-btn { background: var(--accent-warm); }
[data-theme="dark"] .toggle-btn::after { transform: translateX(15px); }
.footer-info {
  font-size: var(--t-xs);
  color: var(--text-faint);
  line-height: 1.4;
}
.footer-info strong { color: var(--text-muted); font-weight: 500; }

/* Mobile topbar */
.mobile-topbar {
  display: none;
  align-items: center;
  justify-content: space-between;
  padding: var(--sp-3) var(--sp-4);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 60;
}
.mobile-topbar .brand-name { font-size: var(--t-md); }
.hamburger {
  background: none;
  border: none;
  padding: var(--sp-2);
  border-radius: var(--radius-sm);
  color: var(--text-mid);
  cursor: pointer;
}
.hamburger:hover { background: var(--surface-alt); color: var(--text); }
.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.35);
  z-index: 49;
  backdrop-filter: blur(2px);
}

.main {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: var(--sp-4) var(--sp-6);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.topbar-title {
  font-family: 'Instrument Serif', Georgia, serif;
  font-size: var(--t-xl);
  color: var(--text);
  font-style: italic;
  line-height: 1.2;
}
.topbar-sub {
  font-size: var(--t-xs);
  color: var(--text-muted);
  margin-top: 2px;
}
.topbar-right {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
}
#clock {
  font-size: var(--t-xs);
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

/* FIX 1 & 2: mode-badge with blinking dot */
.mode-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: var(--t-xs);
  font-weight: 700;
  background: var(--surface-alt);
  border: 1px solid var(--border);
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: .08em;
}
.mode-badge-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  animation: blink 1.4s infinite;
  flex-shrink: 0;
}
.mode-badge.live   { color: var(--success); border-color: var(--success-border); background: var(--success-soft); }
.mode-badge.sim    { color: var(--warn);    border-color: var(--warn-border);    background: var(--warn-soft); }
.mode-badge.replay { color: var(--accent-warm); border-color: var(--border); }

.screens { flex: 1; overflow-y: auto; }
.screen { display: none; padding: var(--sp-6); max-width: 1280px; margin: 0 auto; }
.screen.active { display: block; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  padding: 7px 14px;
  border-radius: var(--radius-sm);
  font-size: var(--t-sm);
  font-weight: 600;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-mid);
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
  text-decoration: none;
}
.btn:hover { background: var(--surface-alt); color: var(--text); }
.btn-primary { background: var(--text); color: var(--bg); border-color: var(--text); }
.btn-primary:hover { opacity: .88; background: var(--text); color: var(--bg); }
.btn-danger { background: var(--danger-soft); color: var(--danger); border-color: var(--danger-border); }
.btn-danger:hover { background: var(--danger); color: #fff; }
.btn-warn { background: var(--warn-soft); color: var(--warn); border-color: var(--warn-border); }
.btn-success { background: var(--success-soft); color: var(--success); border-color: var(--success-border); }
.btn:disabled { opacity: .45; cursor: not-allowed; pointer-events: none; }
.btn-icon { padding: 6px 8px; }
.btn-row { display: flex; gap: var(--sp-2); flex-wrap: wrap; align-items: center; }

.alert-banner {
  display: flex;
  align-items: flex-start;
  gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface-alt);
  margin-bottom: var(--sp-5);
  transition: all .3s;
}
.alert-banner.normal   { border-color: var(--success-border); background: var(--success-soft); }
.alert-banner.attack   { border-color: var(--danger-border);  background: var(--danger-soft); }
.alert-banner.mitigate { border-color: var(--warn-border);    background: var(--warn-soft); }
.alert-banner.resolved { border-color: var(--success-border); background: var(--success-soft); }
.banner-icon { font-size: 1rem; flex-shrink: 0; margin-top: 1px; }
.banner-title { font-size: var(--t-sm); font-weight: 600; color: var(--text); }
.banner-title.attack   { color: var(--danger); }
.banner-title.mitigate { color: var(--warn); }
.banner-title.resolved { color: var(--success); }
.banner-desc { font-size: var(--t-xs); color: var(--text-mid); margin-top: 2px; }

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: var(--sp-4);
  margin-bottom: var(--sp-6);
}
.kpi-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: var(--sp-4) var(--sp-5);
  position: relative;
  overflow: hidden;
  transition: box-shadow .15s;
}
.kpi-card:hover { box-shadow: var(--shadow-md); }
.kpi-top-bar { position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--border); }
.kpi-card.kpi-danger  .kpi-top-bar { background: var(--danger); }
.kpi-card.kpi-warn    .kpi-top-bar { background: var(--warn); }
.kpi-card.kpi-success .kpi-top-bar { background: var(--success); }
.kpi-card.kpi-neutral .kpi-top-bar { background: var(--text-muted); }
.kpi-label { font-size: var(--t-xs); font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; margin-top: var(--sp-1); }
.kpi-value { font-family: 'Instrument Serif', Georgia, serif; font-size: var(--t-3xl); color: var(--text); line-height: 1.1; margin-top: var(--sp-1); }
.kpi-unit  { font-size: var(--t-xs); color: var(--text-muted); margin-top: 2px; }
.kpi-target { font-size: var(--t-xs); color: var(--warn); margin-top: var(--sp-1); font-weight: 500; }
.kpi-target.met { color: var(--success); }

.vm-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: var(--sp-4);
  margin-bottom: var(--sp-6);
}
.vm-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: var(--sp-4);
  display: flex;
  gap: var(--sp-3);
  align-items: flex-start;
  transition: box-shadow .15s;
}
.vm-card:hover { box-shadow: var(--shadow-md); }
.vm-avatar { width: 38px; height: 38px; border-radius: var(--radius-sm); background: var(--surface-alt); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 1.1rem; }
.vm-name { font-weight: 600; font-size: var(--t-sm); color: var(--text); }
.vm-ip   { font-size: var(--t-xs); color: var(--text-muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
.vm-status-row { display: flex; align-items: center; gap: 5px; margin-top: 5px; }
.status-pip-sm { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.status-pip-sm.up      { background: var(--success); }
.status-pip-sm.down    { background: var(--danger); }
.status-pip-sm.standby { background: var(--text-faint); }
.status-pip-sm.active  { background: var(--warn); animation: blink 1.2s infinite; }
.status-label { font-size: var(--t-xs); color: var(--text-muted); }
.status-label.up   { color: var(--success); }
.status-label.down { color: var(--danger); }

.chart-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--sp-4);
  margin-bottom: var(--sp-6);
}
.chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--sp-5); }
.chart-card-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: var(--sp-4); }
.chart-card-title { font-family: 'Instrument Serif', Georgia, serif; font-size: var(--t-md); color: var(--text); font-style: italic; }
.chart-card-sub { font-size: var(--t-xs); color: var(--text-muted); margin-top: 2px; }
.chart-legend { display: flex; gap: var(--sp-4); margin-top: var(--sp-3); }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: var(--t-xs); color: var(--text-muted); }
.legend-swatch { width: 10px; height: 2px; border-radius: 1px; }
.chart-wrap { position: relative; height: 170px; }

.bottom-grid { display: grid; grid-template-columns: 1fr
