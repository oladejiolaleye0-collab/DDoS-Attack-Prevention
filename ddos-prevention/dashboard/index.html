/* Mode badge */
.mode-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: var(--t-xs);
  font-weight: 700;
  background: var(--surface-alt);
  border: 1px solid var(--border);
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: .08em;
}
.mode-badge-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  animation: blink 1.4s infinite;
}
.mode-badge.live   { color: var(--success); border-color: var(--success-border); background: var(--success-soft); }
.mode-badge.sim    { color: var(--warn);    border-color: var(--warn-border);    background: var(--warn-soft); }
.mode-badge.replay { color: var(--accent-warm); border-color: var(--border); }

    <!-- rest of body from cite:186 unchanged until scripts -->

<script>
// existing JS from cite:186 above events section unchanged

// ── Events ───────────────────────────────────────────────
let eventCount = 0;
function addEvent(msg, level = 'INFO') {
  const ts = new Date().toLocaleTimeString('en-GB', { hour12: false });
  const mkDiv = (container) => {
    const div = document.createElement('div');
    div.className = `event-item ${level}`;
    div.innerHTML = `<span class="event-ts">${ts}</span><span class="event-msg">${msg}</span>`;
    container.prepend(div);
    while (container.children.length > 60) container.removeChild(container.lastChild);
  };
  const el1 = document.getElementById('event-log');
  const el2 = document.getElementById('event-log-full');
  if (el1) mkDiv(el1);
  if (el2) mkDiv(el2);
  eventCount++;
  const badge = document.getElementById('events-badge');
  if (badge) {
    badge.textContent = eventCount;
    badge.style.display = eventCount > 0 ? 'inline-block' : 'none';
  }
}
function clearEvents() {
  ['event-log','event-log-full'].forEach(id => { const el = document.getElementById(id); if(el) el.innerHTML = ''; });
  eventCount = 0;
  const badge = document.getElementById('events-badge');
  if (badge) {
    badge.textContent = '0';
    badge.style.display = 'none';
  }
}

// Mode badge helper to sync desktop and mobile
function setModeBadge(mode, labelText) {
  const desktop = document.getElementById('mode-badge');
  const desktopLabel = document.getElementById('mode-badge-label');
  const mobile = document.getElementById('mode-badge-mobile');
  const mobileLabel = document.getElementById('mode-badge-mobile-label');

  ['live','sim','replay'].forEach(m => {
    desktop.classList.remove(m);
    mobile.classList.remove(m);
  });
  desktop.classList.add(mode);
  mobile.classList.add(mode);
  if (desktopLabel) desktopLabel.textContent = labelText;
  if (mobileLabel)  mobileLabel.textContent = labelText;
}

// Initialise mode badges and hide events badge on load
window.addEventListener('DOMContentLoaded', () => {
  // existing DOMContentLoaded body from cite:186 here...
  const badge = document.getElementById('events-badge');
  if (badge) badge.style.display = 'none';
  setModeBadge('live', 'Live');
});
